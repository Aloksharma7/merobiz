services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-merobiz}
      MYSQL_USER: ${DB_USERNAME:-merobiz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-merobiz}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      TZ: Asia/Kathmandu
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    volumes:
      - merobiz_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: MeroBiz
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:TWVyb0JpekxvY2FsRGV2ZWxvcG1lbnRLZXkyMDI2ISE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${API_ORIGIN:-http://localhost:8000}
      APP_TIMEZONE: Asia/Kathmandu
      FRONTEND_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-merobiz}
      DB_USERNAME: ${DB_USERNAME:-merobiz}
      DB_PASSWORD: ${DB_PASSWORD:-merobiz}
      SESSION_DRIVER: database
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: MeroBiz
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  merobiz_mysql:
